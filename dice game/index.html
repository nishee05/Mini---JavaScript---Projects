<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <link href="./style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="m-0 p-0">
    <div class="boxx d-flex flex-lg-row flex-sm-column justify-content-center align-items-center m-5 p-5">
        <!-- Player 1 Box -->
        <div class="playerbox active-player d-flex flex-column p-5 text-center rounded-start-5" id="player1Box">
            <div class="totalscore py-5">
                <h2>PLAYER 1</h2>
                <p class="totalScore1 fs-3">0</p>
                <p class="fs-3">Wins: <span class="player1Wins">0</span></p>
            </div>
            <div class="currentscore border rounded-5 py-5 mt-auto mb-3">
                <h4>CURRENT SCORE</h4>
                <p class="currentScore1 fs-3">0</p>
            </div>
        </div>

        <!-- Center Box -->
        <div class="center-box d-flex flex-column p-5 mx-5 text-center">
            <div class="newGame mt-5">
                <button class="" onclick="reset(false)">New Game</button>
            </div>
            
            <div class="my-auto">
                <div class="rounded-4" id="randomButton" onclick="generateRandomNumber()">
                    <img class="rounded-4" src="./number1.png" alt="img3" height="80" width="80" id="randomNumberText" />
                </div>
            </div>
            <div class="pass mb-5">
                <button onclick="passToOther()">Hold</button>
            </div>
        </div>

        <!-- Player 2 Box -->
        <div class="playerbox inactive-player d-flex flex-column p-5 text-center rounded-end-5" id="player2Box">
            <div class="totalscore py-5">
                <h2>PLAYER 2</h2>
                <p class="totalScore2 fs-3">0</p>
                <p class="fs-3">Wins: <span class="player2Wins">0</span></p>
            </div>
            <div class="currentscore border rounded-5 py-5 mx-4 mt-auto mb-3">
                <h4>CURRENT SCORE</h4>
                <p class="currentScore2 fs-3">0</p>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
