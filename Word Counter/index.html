<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Word Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <textarea id="text-area" rows="10" placeholder="Type or paste your text here..."></textarea>
        <div class="counter">
            <p>Words: <span id="word-count">0</span></p>
            <p>Characters (with spaces): <span id="char-with-space-count">0</span></p>
            <p>Characters (without spaces): <span id="char-without-space-count">0</span></p>
            <p>Special Characters: <span id="special-char-count">0</span></p>
            <p>Sentences: <span id="sentence-count">0</span></p>
            <p>Estimated Reading Time: <span id="reading-time">0</span> minutes</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
