<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Calculator</title>
    <link rel="shortcut icon" href="calculator-icon.png" type="image/x-icon">
    <link href="./style.css" rel="stylesheet">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center mx-auto">
        <div class="roww">
            <input class="input" type="text" placeholder="0"/>
            <button class="button rounded-3 mx-2">C</button>
        </div>
            <div class="roww my-2">
                <button class="button rounded-3 mx-2">7</button>
                <button class="button rounded-3 mx-2">8</button>
                <button class="button rounded-3 mx-2">9</button>
                <button class="button rounded-3 mx-2">*</button>
            </div>
            <div class="roww my-2">
                <button class="button rounded-3 mx-2">4</button>
                <button class="button rounded-3 mx-2">5</button>
                <button class="button rounded-3 mx-2">6</button>
                <button class="button rounded-3 mx-2">/</button>
            </div>
            <div class="roww my-2">
                <button class="button rounded-3 mx-2">1</button>
                <button class="button rounded-3 mx-2">2</button>
                <button class="button rounded-3 mx-2">3</button>
                <button class="button rounded-3 mx-2">+</button>
            </div>
            <div class="roww my-2">
                <button class="button rounded-3 mx-2">0</button>
                <button class="button rounded-3 mx-2">.</button>
                <button class="button rounded-3 mx-2">=</button>
                <button class="button rounded-3 mx-2">-</button>
            </div>

    </div>
<script src="./script.js"></script>
</body>


</html>
